[project]
name = "agent-with-aws"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "underiya-ai", email = "aniketunderiya20@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "langchain-aws",
    "dotenv",
    "langchain-tavily",
    "bedrock-agentcore",
    "aws-opentelemetry-distro",
    "uvicorn",
    "fastapi"
]

[project.scripts]
agent-with-aws = "agent_with_aws:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
